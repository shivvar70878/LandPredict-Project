services:
  - type: web
    name: landpredict-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: landpredict
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false